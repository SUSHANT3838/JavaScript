<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1 class="title">Calculator</h1>

        <section class="calculator" aria-label="Calculator">
            <div class="display">
                <input
                    id="display"
                    class="display__input"
                    type="text"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                />
            </div>

            <div class="keys" aria-label="Calculator keys">
                <button class="key key--utility" type="button" data-action="clear">AC</button>
                <button class="key key--utility" type="button" data-action="delete">DEL</button>
                <button class="key key--utility" type="button" data-action="percent">%</button>
                <button class="key key--op" type="button" data-action="operator" data-value="/">÷</button>

                <button class="key" type="button" data-action="digit" data-value="7">7</button>
                <button class="key" type="button" data-action="digit" data-value="8">8</button>
                <button class="key" type="button" data-action="digit" data-value="9">9</button>
                <button class="key key--op" type="button" data-action="operator" data-value="*">×</button>

                <button class="key" type="button" data-action="digit" data-value="4">4</button>
                <button class="key" type="button" data-action="digit" data-value="5">5</button>
                <button class="key" type="button" data-action="digit" data-value="6">6</button>
                <button class="key key--op" type="button" data-action="operator" data-value="-">−</button>

                <button class="key" type="button" data-action="digit" data-value="1">1</button>
                <button class="key" type="button" data-action="digit" data-value="2">2</button>
                <button class="key" type="button" data-action="digit" data-value="3">3</button>
                <button class="key key--op" type="button" data-action="operator" data-value="+">+</button>

                <button class="key key--wide" type="button" data-action="digit" data-value="0">0</button>
                <button class="key" type="button" data-action="decimal">.</button>
                <button class="key key--equals" type="button" data-action="equals">=</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
