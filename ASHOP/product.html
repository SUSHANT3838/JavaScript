<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjit-ColdDrink-Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main part of the page -->
    <main>
        <div class="menu-bar">
            <div class="logo">
                <h1><span>Ranjit-ColdDrink-Shop</span></h1>
            </div>
            <div class="elements">
                <a href="index.html"> <span>Home</span> </a>
                <a href="product.html"> <span>Product</span> </a>
                <a href="about.html"> <span>About</span> </a>
                <a href="contact.html"> <span>Contact</span> </a>

            <div class="login" style="opacity: 1;">
                <button>Login</button>
            </div>
        </div>

        <div class="product">
            <div class="item" data-name="Pepsi" data-price="10">
                <img src="image/background.png" alt="Pepsi">
                <h2>Pepsi</h2>
                <p class="price-line">Price: Rs <span class="unit-price">10</span></p>
                <div class="qty-controls" aria-label="Select quantity">
                    <button class="qty-btn" type="button" data-qty="minus" aria-label="Decrease quantity">-</button>
                    <input class="qty-input" type="text" value="1" readonly aria-label="Quantity">
                    <button class="qty-btn" type="button" data-qty="plus" aria-label="Increase quantity">+</button>
                </div>
                <div class="cart-btn">
                    <button class="buy-now" type="button">Buy Now</button>
                </div>
            </div>
